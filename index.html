<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тендерный отдел — CRM</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div class="logo-text">
        <strong>Тендерный отдел</strong>
        <span>CRM · v1.0</span>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard"><span class="ni-ico">📈</span> Дашборд</button>
      <button class="nav-item" data-view="purchases"><span class="ni-ico">🗂</span> Реестр закупок</button>
      <button class="nav-item" data-view="purchase"><span class="ni-ico">📋</span> Карточка закупки</button>
      <button class="nav-item" data-view="settings"><span class="ni-ico">⚙️</span> Настройки</button>
      <button class="nav-item" data-view="about"><span class="ni-ico">📘</span> Инструкция</button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-block" id="btnExport">💾 Экспорт (бэкап)</button>
      <button class="btn btn-ghost btn-block" id="btnImport">📥 Импорт JSON</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </aside>
  <main class="content" id="content">
    <div class="topbar">
      <button class="hamburger" id="btnMenu">☰</button>
      <h1 id="pageTitle">Дашборд</h1>
      <div class="topbar-right" id="topbarRight"></div>
    </div>
    <div id="viewContainer" class="view-container"></div>
  </main>
</div>

<!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">Заголовок</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toastWrap"></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
